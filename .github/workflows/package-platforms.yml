name: Build and release platform packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-latest
            adb_platform: windows
            adb_source: windows-x86_64
            archive: zip
          - platform: linux-x86_64
            runner: ubuntu-latest
            adb_platform: linux
            adb_source: linux-x86_64
            archive: tar.gz
          - platform: macos-arm64
            runner: macos-latest
            adb_platform: macos
            adb_source: macos-aarch64
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Keep only the native renderer matching this runner in the application JAR.
      - name: Keep only this platform's bundled native resources
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            windows-x86_64) keep="windows-x86_64" ;;
            linux-x86_64) keep="linux-x86_64" ;;
            macos-arm64) keep="macos-aarch64" ;;
            *) echo "Unknown platform: ${{ matrix.platform }}"; exit 1 ;;
          esac
          for dir in scrcpy-swing-poc/src/main/resources/native/*; do
            [ -d "$dir" ] || continue
            [ "$(basename "$dir")" = "$keep" ] || rm -rf "$dir"
          done

      - name: Build Swing client
        run: mvn -B -pl scrcpy-swing-poc -am install -DskipTests

      # jpackage copies the input directory into app/; keep platform-tools next
      # to the application JAR so Adb.resolveExecutable() finds it from CodeSource.
      - name: Prepare application input with bundled ADB and scrcpy server
        shell: bash
        run: |
          set -euo pipefail
          input="scrcpy-swing-poc/target/package-input"
          mkdir -p "$input/platform-tools/${{ matrix.adb_platform }}" "$input/lib"
          cp scrcpy-swing-poc/target/scrcpy-swing-poc-*.jar "$input/"
          mvn -B -pl scrcpy-swing-poc dependency:copy-dependencies \
            -DincludeScope=runtime \
            -DoutputDirectory="${{ github.workspace }}/$input"

          cp -R "platform-tools/${{ matrix.adb_source }}/." "$input/platform-tools/${{ matrix.adb_platform }}/"
          cp lib/scrcpy-server-v5.0.1.jar "$input/lib/"

          if [ "${{ matrix.adb_platform }}" != "windows" ]; then
            chmod +x "$input/platform-tools/${{ matrix.adb_platform }}/adb"
          fi

          adb_name="adb"
          if [ "${{ matrix.adb_platform }}" = "windows" ]; then adb_name="adb.exe"; fi
          test -f "$input/platform-tools/${{ matrix.adb_platform }}/$adb_name"

      - name: Verify platform-native dependency isolation
        shell: bash
        run: |
          set -euo pipefail
          input="scrcpy-swing-poc/target/package-input"
          files="$(for jar in "$input"/*.jar; do [ -f "$jar" ] || continue; basename "$jar"; done)"
          echo "Packaged JARs:"
          printf '%s\n' "$files"
          case "${{ matrix.platform }}" in
            windows-x86_64) forbidden='linux-|macosx-' ;;
            linux-x86_64) forbidden='windows-|macosx-' ;;
            macos-x86_64) forbidden='windows-|linux-' ;;
            macos-arm64) forbidden='windows-|linux-|macosx-x86_64' ;;
            *) echo "Unknown platform: ${{ matrix.platform }}"; exit 1 ;;
          esac
          if printf '%s\n' "$files" | grep -E "$forbidden"; then
            echo "Foreign-platform native dependency found in package input."
            exit 1
          fi
          if ! printf '%s\n' "$files" | grep -E '^(ffmpeg|javacpp)-.*-(windows-x86_64|linux-x86_64|macosx-x86_64|macosx-arm64)\.jar$' >/dev/null; then
            echo "Expected platform-native JavaCPP/FFmpeg JARs were not found."
            exit 1
          fi

      - name: Create native application image
        shell: bash
        env:
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.2.0' }}
        run: |
          set -euo pipefail
          VERSION="${APP_VERSION#v}"
          if [[ "${{ matrix.platform }}" == macos-* && "$VERSION" =~ ^0\. ]]; then
            VERSION="1.${VERSION#0.}"
          fi
          echo "jpackage app version: $VERSION"
          jpackage \
            --type app-image \
            --name scrcpy-java \
            --input scrcpy-swing-poc/target/package-input \
            --app-content scrcpy-swing-poc/target/package-input/platform-tools \
            --app-content scrcpy-swing-poc/target/package-input/lib \
            --dest scrcpy-swing-poc/target/dist \
            --main-jar "$(basename scrcpy-swing-poc/target/package-input/scrcpy-swing-poc-*.jar)" \
            --main-class com.jian.scrcpy.swing.SwingScrcpyApp \
            --app-version "$VERSION" \
            --vendor "scrcpy-java" \
            --java-options "--enable-native-access=ALL-UNNAMED"

      - name: Smoke-check packaged ADB and application image
        shell: bash
        run: |
          set -euo pipefail
          image="scrcpy-swing-poc/target/dist/scrcpy-java"
          app_dir="$image/app"
          if [[ "${{ matrix.platform }}" == macos-* ]]; then
            image="scrcpy-swing-poc/target/dist/scrcpy-java.app"
            app_dir="$image/Contents/app"
          fi
          test -d "$app_dir"
          adb_dir="$app_dir/platform-tools/${{ matrix.adb_platform }}"
          echo "Application image contents:"
          find "$app_dir" -maxdepth 4 -type f \( -name adb -o -name adb.exe -o -name 'AdbWin*.dll' -o -name 'scrcpy-server-v5.0.1.jar' \) -print
          if [[ "${{ matrix.adb_platform }}" == windows ]]; then
            test -f "$adb_dir/adb.exe"
            test -f "$adb_dir/AdbWinApi.dll"
            test -f "$adb_dir/AdbWinUsbApi.dll"
          else
            test -f "$adb_dir/adb"
            # jpackage may not preserve executable bits consistently on Linux.
            # Restore the bit in the final image before archiving it.
            chmod 755 "$adb_dir/adb"
            test -x "$adb_dir/adb"
          fi
          test -f "$app_dir/lib/scrcpy-server-v5.0.1.jar"
          echo "Bundled ADB verified at: $adb_dir"
          echo "Bundled scrcpy server verified at: $app_dir/lib/scrcpy-server-v5.0.1.jar"

      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path scrcpy-swing-poc/target/dist/scrcpy-java -DestinationPath scrcpy-java-${{ matrix.platform }}.zip

      - name: Archive macOS package
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent scrcpy-swing-poc/target/dist/scrcpy-java.app scrcpy-java-${{ matrix.platform }}.zip

      - name: Archive Linux package
        if: runner.os == 'Linux'
        run: tar -C scrcpy-swing-poc/target/dist -czf scrcpy-java-${{ matrix.platform }}.tar.gz scrcpy-java

      - uses: actions/upload-artifact@v4
        with:
          name: scrcpy-java-${{ matrix.platform }}
          path: scrcpy-java-${{ matrix.platform }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: scrcpy-java-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          echo "Release assets:"
          find release-assets -maxdepth 1 -type f -printf '%f\n'
          count="$(find release-assets -maxdepth 1 -type f | wc -l)"
          if [ "$count" -ne 3 ]; then
            echo "Expected 3 platform archives, found $count."
            exit 1
          fi

      - name: Create GitHub Release and upload packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: scrcpy-java ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
