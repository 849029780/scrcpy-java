name: Desktop Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            adb_url: https://dl.google.com/android/repository/platform-tools-latest-windows.zip
          - os: macos-latest
            platform: macos
            adb_url: https://dl.google.com/android/repository/platform-tools-latest-darwin.zip
          - os: ubuntu-latest
            platform: linux
            adb_url: https://dl.google.com/android/repository/platform-tools-latest-linux.zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build application
        shell: pwsh
        run: |
          mvn -B -ntp clean install -DskipTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assemble jpackage input
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package-input | Out-Null
          Copy-Item "scrcpy-app/target/scrcpy-app-0.2.0-SNAPSHOT.jar" package-input/
          mvn -B -ntp -pl scrcpy-app dependency:copy-dependencies "-DincludeScope=runtime" "-DoutputDirectory=$PWD/package-input"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Invoke-WebRequest -Uri "${{ matrix.adb_url }}" -OutFile platform-tools.zip
          Expand-Archive platform-tools.zip -DestinationPath adb-download -Force
          New-Item -ItemType Directory -Force "package-input/platform-tools/${{ matrix.platform }}" | Out-Null
          Copy-Item "adb-download/platform-tools/*" "package-input/platform-tools/${{ matrix.platform }}/" -Recurse -Force
          Invoke-WebRequest -Uri "https://github.com/Genymobile/scrcpy/releases/download/v5.0.1/scrcpy-server-v5.0.1" -OutFile "package-input/scrcpy-server-v5.0.1"
          $expected = "764eb6f79811d5211fe9df341120882ba9994c7a61b897d7bf3fb662e53bc536"
          $actual = (Get-FileHash "package-input/scrcpy-server-v5.0.1" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "scrcpy-server SHA-256 mismatch: $actual" }

      - name: Create self-contained app image
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          jpackage --type app-image --input package-input --dest dist --name scrcpy-java --main-jar scrcpy-app-0.2.0-SNAPSHOT.jar --main-class com.jian.scrcpy.app.ScrcpyApp --java-options "--enable-native-access=javafx.graphics,ALL-UNNAMED"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-check packaged files
        shell: pwsh
        run: |
          $image = "dist/scrcpy-java"
          if (-not (Test-Path $image)) { throw "jpackage image missing" }
          $adbName = if ("${{ matrix.platform }}" -eq "windows") { "adb.exe" } else { "adb" }
          $adb = Get-ChildItem $image -Recurse -File -Filter $adbName | Where-Object { $_.FullName -match "platform-tools" } | Select-Object -First 1
          if ($null -eq $adb) { throw "bundled adb missing from app image" }
          $server = Get-ChildItem $image -Recurse -File -Filter "scrcpy-server-v5.0.1" | Select-Object -First 1
          if ($null -eq $server) { throw "bundled scrcpy-server missing from app image" }

      - uses: actions/upload-artifact@v4
        with:
          name: scrcpy-java-${{ matrix.platform }}
          path: dist/scrcpy-java
          if-no-files-found: error
