name: Maven CI
on:
  push:
    paths-ignore:
      - 'scrcpy-swing-poc/src/main/resources/native/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.filter.outputs.windows }}
      linux: ${{ steps.filter.outputs.linux }}
      macos: ${{ steps.filter.outputs.macos }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            windows:
              - 'scrcpy-swing-poc/native/CMakeLists.txt'
              - 'scrcpy-swing-poc/native/src/scrcpy_swing_d3d11.cpp'
              - '.github/workflows/maven.yml'
            linux:
              - 'scrcpy-swing-poc/native/CMakeLists.txt'
              - 'scrcpy-swing-poc/native/src/scrcpy_swing_vaapi.cpp'
              - '.github/workflows/maven.yml'
            macos:
              - 'scrcpy-swing-poc/native/CMakeLists.txt'
              - 'scrcpy-swing-poc/native/src/scrcpy_swing_metal.mm'
              - '.github/workflows/maven.yml'

  native:
    needs: changes
    if: ${{ always() && needs.changes.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            target: windows-x86_64
            library: scrcpy_swing_d3d11.dll
            source: scrcpy-swing-poc/native/build/Release/scrcpy_swing_d3d11.dll
          - platform: linux
            os: ubuntu-latest
            target: linux-x86_64
            library: libscrcpy_swing_vaapi.so
            source: scrcpy-swing-poc/native/build/libscrcpy_swing_vaapi.so
          - platform: macos
            os: macos-latest
            target: macos-aarch64
            library: libscrcpy_swing_metal.dylib
            source: scrcpy-swing-poc/native/build/libscrcpy_swing_metal.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check whether this platform needs rebuilding
        if: ${{ github.event_name != 'workflow_dispatch' && needs.changes.outputs[matrix.platform] != 'true' }}
        run: echo "No native source changes for ${{ matrix.platform }}; this matrix entry should be skipped."
      - uses: actions/checkout@v4
        if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs[matrix.platform] == 'true' }}
      - uses: actions/setup-java@v5
        if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs[matrix.platform] == 'true' }}
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Linux native renderer dependencies
        if: ${{ matrix.platform == 'linux' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs[matrix.platform] == 'true') }}
        run: sudo apt-get update && sudo apt-get install -y libva-dev libva-x11-2 libx11-dev pkg-config
      - name: Configure native Swing renderer
        if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs[matrix.platform] == 'true' }}
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            cmake -S scrcpy-swing-poc/native -B scrcpy-swing-poc/native/build -A x64
          else
            cmake -S scrcpy-swing-poc/native -B scrcpy-swing-poc/native/build -DCMAKE_BUILD_TYPE=Release
          fi
      - name: Build native Swing renderer
        if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs[matrix.platform] == 'true' }}
        run: cmake --build scrcpy-swing-poc/native/build --config Release
      - name: Stage native renderer artifact
        if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs[matrix.platform] == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "native-output/${{ matrix.target }}"
          cp "${{ matrix.source }}" "native-output/${{ matrix.target }}/${{ matrix.library }}"
      - name: Upload native renderer
        if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs[matrix.platform] == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: scrcpy-swing-native-${{ matrix.target }}
          path: native-output/
          if-no-files-found: error

  java-build:
    needs: [changes, native]
    if: ${{ always() && needs.changes.result == 'success' && (needs.native.result == 'success' || needs.native.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Download rebuilt native libraries
        if: ${{ needs.native.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          pattern: scrcpy-swing-native-*
          path: native-artifacts
          merge-multiple: true
      - name: Overlay rebuilt native libraries
        if: ${{ needs.native.result == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d native-artifacts ]]; then
            cp -R native-artifacts/. scrcpy-swing-poc/src/main/resources/native/
          fi
      - name: Build Java modules once
        run: mvn -B -ntp clean verify

  publish-native:
    needs: [changes, native, java-build]
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.native.result == 'success' && needs.java-build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Download rebuilt native libraries
        uses: actions/download-artifact@v4
        with:
          pattern: scrcpy-swing-native-*
          path: native-artifacts
          merge-multiple: true
      - name: Overlay rebuilt native libraries
        shell: bash
        run: |
          set -euo pipefail
          resource_root="scrcpy-swing-poc/src/main/resources/native"
          mkdir -p "$resource_root"
          cp -R native-artifacts/. "$resource_root/"
      - name: Commit changed native libraries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scrcpy-swing-poc/src/main/resources/native
          if git diff --cached --quiet; then
            echo "Native libraries are already up to date."
            exit 0
          fi
          git commit -m "Bundle updated native renderer libraries"
          git push origin "HEAD:${GITHUB_REF_NAME}"
